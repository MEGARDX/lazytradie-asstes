<!doctype html>
<html><head><meta charset="utf-8">
<!-- AI Receptionist poster, 1080×1350, in the reel's look. -->
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&family=JetBrains+Mono:wght@600&display=block" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter Tight',sans-serif;color:#fff;-webkit-font-smoothing:antialiased;background:#000}
#p{position:relative;width:1080px;height:1350px;overflow:hidden;background:#000}
.a{position:absolute;border-radius:50%;filter:blur(90px)}
.g{position:absolute;isolation:isolate;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.04));
 box-shadow:0 30px 80px rgba(0,0,0,.5),inset 0 1.5px 1px rgba(255,255,255,.6),inset 0 -12px 28px rgba(255,255,255,.06),inset 0 0 0 1px rgba(255,255,255,.18)}
.ch{height:74px;border-radius:37px;display:flex;align-items:center;gap:14px;padding:0 28px;font-size:27px;font-weight:500}
.ch i{font-size:30px}
.tp{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:16px;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.9);color:#0a7f5c}
</style></head><body>
<div id="p">
  <div class="a" style="left:-160px;top:420px;width:620px;height:560px;background:rgba(34,225,255,.55)"></div>
  <div class="a" style="right:-180px;top:520px;width:640px;height:600px;background:rgba(255,47,185,.55)"></div>
  <div class="a" style="left:300px;top:840px;width:560px;height:420px;background:rgba(255,176,31,.5)"></div>
  <img src="img/wm_white.png" style="position:absolute;left:50%;top:64px;width:280px;transform:translateX(-50%)">
  <div style="position:absolute;left:0;right:0;top:170px;text-align:center;letter-spacing:-.045em;line-height:.95">
    <div style="font-size:84px;font-weight:300">Introducing the</div>
    <div style="font-size:118px;font-weight:600;background:linear-gradient(90deg,#22E1FF,#FF2FB9 55%,#FFB01F);-webkit-background-clip:text;color:transparent">AI Receptionist</div></div>
  <div style="position:absolute;left:0;right:0;top:420px;text-align:center;font-size:32px;color:#cfdae4;letter-spacing:-.02em">Answers every call, SMS and web enquiry.<br>Books the job straight into your calendar.</div>

  <div class="g ch" style="left:150px;top:590px"><i class="ph-fill ph-phone-call" style="color:#22E1FF"></i>Calls</div>
  <div class="g ch" style="left:420px;top:590px"><i class="ph-fill ph-chat-circle-text" style="color:#FF2FB9"></i>SMS</div>
  <div class="g ch" style="left:660px;top:590px"><i class="ph-fill ph-globe" style="color:#FFB01F"></i>Web</div>

  <div class="g" id="bk" style="left:90px;top:730px;width:900px;height:190px;border-radius:44px;display:flex;align-items:center;gap:26px;padding:0 40px">
    <div style="width:90px;height:90px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none"><i class="ph-fill ph-check-circle" style="font-size:64px;color:#12b886"></i></div>
    <div style="flex:1"><div style="font-size:42px;font-weight:600;letter-spacing:-.03em">New job booked</div>
      <div style="font-size:25px;color:#e6edf3;margin-top:4px">Sarah Mitchell · Power point install</div></div>
    <div style="text-align:right"><div style="font-size:28px;font-weight:600">Mon 9:00 AM</div><div style="margin-top:10px"><span class="tp">T1 · Auto-book</span></div></div></div>

  <div class="g" style="left:50%;top:990px;width:400px;height:110px;border-radius:55px;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:12px">
    <span style="font-size:60px;font-weight:600;letter-spacing:-.04em;background:linear-gradient(90deg,#22E1FF,#FF2FB9,#FFB01F);-webkit-background-clip:text;color:transparent">$49</span>
    <span style="font-size:28px;color:#e6edf3">/ month</span></div>
  <div style="position:absolute;left:0;right:0;top:1150px;text-align:center;font-size:52px;letter-spacing:-.035em">Never miss a job again.</div>
  <div style="position:absolute;left:0;right:0;top:1240px;text-align:center;font-family:'JetBrains Mono',monospace;font-weight:600;font-size:26px;color:#cfdae4">lazytradie.com.au</div>
</div>
<script src="liquid-glass.js"></script>
<script>
(async()=>{await document.fonts.ready;
document.querySelectorAll('.g').forEach(e=>liquidGlass(e,{scale:-120,chroma:7,blur:5}));
document.body.dataset.ready='1';})();
</script></body></html>
