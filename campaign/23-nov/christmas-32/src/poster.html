<!doctype html>
<html><head><meta charset="utf-8">
<!-- "32 sleeps till Christmas." (Mon 23 Nov). Curly-haired campaign girl in a Santa hat decorating a Christmas tree on a
     sunny beach. Liquid-glass chips with squarer corners over the sand and the striped towel. No price. -->
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Instrument+Serif:ital@0;1&display=block" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter Tight',sans-serif;-webkit-font-smoothing:antialiased;background:#000}
#p{position:relative;width:1080px;height:1350px;overflow:hidden;background:#E9D9BE;color:#fff}
.abs{position:absolute}
.sh{text-shadow:0 4px 26px rgba(10,40,90,.35)}
.g{position:absolute;isolation:isolate;overflow:hidden;color:#fff;border-radius:14px;
  background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(10,25,45,.58));
  box-shadow:0 22px 46px rgba(40,30,10,.35),inset 0 1.5px 0 rgba(255,255,255,.8),inset 0 0 0 1.2px rgba(255,255,255,.4);text-shadow:0 1px 8px rgba(0,0,0,.4)}
.chip{display:flex;align-items:center;gap:13px;height:70px;padding:0 24px 0 12px;font-size:25px;font-weight:700;white-space:nowrap;letter-spacing:-.01em}
.ic{width:46px;height:46px;border-radius:9px;display:grid;place-items:center;font-size:24px;color:#0D1B2A;flex:none;background:linear-gradient(160deg,#FFD27A,#F5A623 60%,#D98200);box-shadow:inset 0 1px 1px rgba(255,255,255,.6)}
</style></head><body>
<div id="p">
  <img class="abs" src="img/photo.png" style="left:0;top:0;width:1080px;height:1350px;object-fit:cover;object-position:50% 0">
  <div class="abs" style="left:0;right:0;top:0;height:360px;background:linear-gradient(180deg,rgba(10,60,140,.28),rgba(10,60,140,0))"></div>
  <div class="abs" style="left:0;right:0;bottom:0;height:300px;background:linear-gradient(180deg,rgba(60,40,15,0),rgba(60,40,15,.32))"></div>

  <img class="abs" src="img/wm_white.png" style="right:44px;top:34px;height:30px;opacity:.95;filter:drop-shadow(0 2px 8px rgba(10,40,90,.35))">
  <div class="abs sh" style="left:40px;top:6px;font-size:300px;font-weight:800;letter-spacing:-.07em;line-height:1">32</div>
  <div class="abs sh" style="left:462px;top:88px;line-height:1">
    <div style="font-size:74px;font-weight:700;letter-spacing:-.04em">sleeps till</div>
    <div style="font-family:'Instrument Serif',serif;font-style:italic;font-size:104px;color:#FFC24D;letter-spacing:-.015em;margin-top:-2px">Christmas.</div>
  </div>

  <div class="g" id="card" style="left:36px;top:1120px;width:560px;padding:22px 26px 24px">
    <div style="font-size:31px;font-weight:800;letter-spacing:-.03em;line-height:1.15">100 “can you do it before Christmas?” calls.</div>
    <div style="font-size:24px;font-weight:600;opacity:.92;margin-top:8px">Ruby answers every one and books them in.</div>
    <div style="display:inline-flex;align-items:center;gap:10px;margin-top:16px;height:54px;padding:0 20px;border-radius:10px;background:linear-gradient(180deg,#FFC24D,#F5A623);color:#0D1B2A;font-size:23px;font-weight:800;text-shadow:none">Comment “DEMO” <i class="ph-fill ph-arrow-right"></i></div>
  </div>
  <div class="g chip" id="c1" style="top:1178px"><span class="ic"><i class="ph-fill ph-seal-check"></i></span>$0 setup fee</div>
  <div class="g chip" id="c2" style="top:1262px"><span class="ic"><i class="ph-fill ph-lightning"></i></span>Live in minutes</div>
</div>
<script src="liquid-glass.js"></script>
<script>
(async () => {
  await document.fonts.load("800 300px 'Inter Tight'"); await document.fonts.load("italic 104px 'Instrument Serif'"); await document.fonts.load('24px Phosphor-Fill');
  await document.fonts.ready; await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => i.onload = i.onerror = r)));
  for (const id of ['c1', 'c2']) { const c = document.getElementById(id); c.style.left = (1080 - 40 - c.offsetWidth) + 'px'; }
  document.querySelectorAll('.g').forEach(g => liquidGlass(g, { scale: -70, chroma: 4, blur: 7, radius: 14 }));
  await new Promise(r => setTimeout(r, 400));
  document.body.dataset.ready = '1';
})();
</script>
</body></html>
