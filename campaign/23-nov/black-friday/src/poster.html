<!doctype html>
<html><head><meta charset="utf-8">
<!-- Black Friday, Mon 23 Nov (posted 8 am). Respectful, not a sales shout:
     "Black Friday. A quiet thank you to the people who build Australia."
     Blonde campaign face in timeless black, black hard hat. Liquid-glass chips with squarer corners. No price. -->
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@500&display=block" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter Tight',sans-serif;-webkit-font-smoothing:antialiased;background:#000}
#p{position:relative;width:1080px;height:1350px;overflow:hidden;background:#040605;color:#F3EDE2}
.abs{position:absolute}
#photo{position:absolute;left:0;top:96px;width:1080px}
.g{position:absolute;isolation:isolate;overflow:hidden;display:flex;align-items:center;gap:14px;white-space:nowrap;color:#F3EDE2;font-weight:600;letter-spacing:-.01em;
  border-radius:12px;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(10,10,10,.55));
  box-shadow:0 20px 44px rgba(0,0,0,.55),inset 0 1.5px 0 rgba(255,255,255,.7),inset 0 0 0 1.2px rgba(255,255,255,.32);text-shadow:0 1px 8px rgba(0,0,0,.5)}
.g .ic{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;font-size:24px;color:#0B0B0B;flex:none;
  background:linear-gradient(160deg,#F1CB7A,#D9A441 60%,#B98428);box-shadow:inset 0 1px 1px rgba(255,255,255,.6)}
.gold{color:#E2B358}
</style></head><body>
<div id="p">
  <img id="photo" src="img/photo.png">
  <!-- blend the photo's top edge into the black -->
  <div class="abs" style="left:0;right:0;top:80px;height:120px;background:linear-gradient(180deg,#040605,rgba(4,6,5,0))"></div>
  <div class="abs" style="left:0;right:0;bottom:0;height:330px;background:linear-gradient(180deg,rgba(4,6,5,0),rgba(4,6,5,.88) 70%)"></div>

  <img class="abs" src="img/wm_white.png" style="left:50%;top:52px;height:30px;transform:translateX(-50%);opacity:.92">
  <div class="abs" style="left:0;right:0;top:120px;text-align:center;font-family:'DM Mono',monospace;font-size:19px;letter-spacing:.34em" ><span class="gold">BLACK FRIDAY</span></div>
  <div class="abs" style="left:60px;right:60px;top:162px;text-align:center;font-family:'Instrument Serif',serif;font-size:62px;line-height:1.08;letter-spacing:-.01em;color:#F3EDE2">
    <i>A quiet thank you</i> to the people<br>who build Australia.</div>

  <div class="g" id="c1" style="top:1132px;height:70px;padding:0 24px 0 13px;font-size:25px" data-lg><span class="ic"><i class="ph-fill ph-seal-check"></i></span>$0 setup fee</div>
  <div class="g" id="c2" style="top:1132px;height:70px;padding:0 24px 0 13px;font-size:25px" data-lg><span class="ic"><i class="ph-fill ph-lightning"></i></span>Live in minutes</div>
  <div class="g" id="c3" style="top:1218px;height:70px;padding:0 26px;font-size:25px;font-weight:700" data-lg>Comment “DEMO” <i class="ph-fill ph-arrow-right gold" style="font-size:24px"></i></div>
  <div class="abs" style="left:0;right:0;top:1306px;text-align:center;font-family:'DM Mono',monospace;font-size:15px;letter-spacing:.22em;color:rgba(243,237,226,.55)">LAZYTRADIE.COM.AU</div>
</div>
<script src="liquid-glass.js"></script>
<script>
(async () => {
  await document.fonts.load("italic 62px 'Instrument Serif'"); await document.fonts.load("600 25px 'Inter Tight'"); await document.fonts.load("19px 'DM Mono'"); await document.fonts.load('24px Phosphor-Fill');
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => i.onload = i.onerror = r)));
  const c1 = document.getElementById('c1'), c2 = document.getElementById('c2'), c3 = document.getElementById('c3'), gap = 16, tot = c1.offsetWidth + gap + c2.offsetWidth;
  c1.style.left = (1080 - tot) / 2 + 'px'; c2.style.left = (1080 - tot) / 2 + c1.offsetWidth + gap + 'px'; c3.style.left = (1080 - c3.offsetWidth) / 2 + 'px';
  document.querySelectorAll('.g').forEach(g => liquidGlass(g, { scale: -70, chroma: 4, blur: 7, radius: 12 }));
  await new Promise(r => setTimeout(r, 400));
  document.body.dataset.ready = '1';
})();
</script>
</body></html>
