<!doctype html>
<html><head><meta charset="utf-8">
<!-- Smoko Room cover v2: owner's flat illustration + type. 1640×856, text kept in the mobile-safe centre. -->
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;500;600;700;800&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter Tight',sans-serif;-webkit-font-smoothing:antialiased;background:#000}
#p{position:relative;width:1640px;height:856px;overflow:hidden;background:url(img/smoko.jpg) center bottom/1640px auto}
.c{position:absolute;left:0;right:0;text-align:center}
.pill{display:inline-flex;align-items:center;height:50px;padding:0 24px;border-radius:25px;font-size:21px;font-weight:700;letter-spacing:.04em;color:#fff;
  background:linear-gradient(180deg,#FFB52E,#F29A00);box-shadow:0 10px 24px rgba(13,27,42,.25),inset 0 2px 1px rgba(255,255,255,.6);text-shadow:0 1px 3px rgba(150,70,0,.35)}
h1{font-size:112px;letter-spacing:-.055em;line-height:.95;color:#0D1B2A}
h1 span{font-weight:300} h1 b{font-weight:800}
.tag{display:inline-flex;align-items:center;height:62px;padding:0 30px;border-radius:31px;background:#fff;box-shadow:0 10px 26px rgba(13,27,42,.18);font-size:31px;font-weight:700;letter-spacing:-.02em;color:#0D1B2A}
.tag em{font-style:normal;color:#C77700;margin-left:10px}
</style></head><body>
<div id="p">
  <div class="c" style="top:30px"><span class="pill">AUSSIE TRADIES BUSINESS GROUP</span></div>
  <div class="c" style="top:96px"><h1><span>The </span><b>Smoko Room</b></h1></div>
  <div class="c" style="top:212px"><span class="tag">Talk shop. Share wins. <em>Grow your trade.</em></span></div>
  <div style="position:absolute;right:200px;bottom:30px;display:flex;align-items:center;gap:10px;color:#0D1B2A;font-size:20px;font-weight:600">by <img src="img/wm_navy.png" style="width:180px"></div>
</div>
<script>document.fonts.ready.then(()=>document.body.dataset.ready='1')</script>
</body></html>
