<!doctype html>
<html><head><meta charset="utf-8">
<!-- Smoko Room cover v3, 1640×856. Facebook desktop shows only a ~1640×610 middle band (y≈125–731),
     so the type sits left and the scaled illustration right, both inside that band. -->
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;500;600;700;800&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter Tight',sans-serif;-webkit-font-smoothing:antialiased;background:#000}
#p{position:relative;width:1640px;height:856px;overflow:hidden;
  background:linear-gradient(180deg,#62B9E6 0%,#5AAFE0 60%,#F5EEDD 66%,#F5EEDD 100%)}
#il{position:absolute;right:0;top:118px;width:1200px;height:634px;background:url(img/smoko.jpg) center/cover;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 220px),linear-gradient(180deg,transparent 0,#000 40px,#000 92%,transparent 100%);
  -webkit-mask-composite:source-in;mask-composite:intersect}
.txt{position:absolute;left:150px;top:228px;color:#fff}
.pill{display:inline-flex;align-items:center;height:48px;padding:0 22px;border-radius:24px;font-size:19px;font-weight:700;letter-spacing:.05em;
  background:linear-gradient(180deg,#FFB52E,#F29A00);box-shadow:0 10px 22px rgba(13,27,42,.22),inset 0 2px 1px rgba(255,255,255,.6);text-shadow:0 1px 3px rgba(150,70,0,.35)}
h1{margin-top:20px;font-size:104px;letter-spacing:-.055em;line-height:.9;text-shadow:0 4px 24px rgba(13,60,100,.25)}
h1 span{display:block;font-weight:300} h1 b{display:block;font-weight:800}
.tag{display:inline-flex;align-items:center;margin-top:26px;height:58px;padding:0 26px;border-radius:29px;background:#fff;color:#0D1B2A;font-size:26px;font-weight:700;letter-spacing:-.02em;
  box-shadow:0 10px 26px rgba(13,27,42,.18)}
.tag em{font-style:normal;color:#C77700;margin-left:9px}
.by{display:flex;align-items:center;gap:10px;margin-top:22px;font-size:18px;font-weight:600}
</style></head><body>
<div id="p">
  <div id="il"></div>
  <div class="txt">
    <span class="pill">AUSSIE TRADIES BUSINESS GROUP</span>
    <h1><span>The</span><b>Smoko Room</b></h1>
    <div class="tag">Talk shop. Share wins. <em>Grow your trade.</em></div>
    <div class="by" style="color:#0D1B2A">by <img src="img/wm_navy.png" style="width:170px"></div>
  </div>
</div>
<script>document.fonts.ready.then(()=>document.body.dataset.ready='1')</script>
</body></html>
