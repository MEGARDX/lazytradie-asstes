<!doctype html>
<html><head><meta charset="utf-8">
<!-- "T20 week. Eyes on the cricket." (Tue 17 Nov; five-match T20I series starts in Melbourne Sat 21 Nov). 1080×1350.
     Blonde influencer at the practice nets, campaign-lit on location. Liquid glass chips (liquid-glass-web skill), tuned for legibility:
     darker tint + bold white type. No price shown today (owner's call). -->
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700;800&display=block" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter Tight',sans-serif;-webkit-font-smoothing:antialiased;background:#000}
#p{position:relative;width:1080px;height:1350px;overflow:hidden;color:#fff;background:#6DB3E5}
.abs{position:absolute}
.photo{position:absolute;inset:0;background:url(img/photo.jpg) center top/1088px auto}
.big{letter-spacing:-.05em;line-height:.95;text-shadow:0 3px 24px rgba(6,40,80,.35)}
.am{color:#FFC24D;text-shadow:0 3px 18px rgba(120,60,0,.4)}
.lbl{position:absolute;display:flex;align-items:center;gap:12px;height:54px;padding:0 22px 0 12px;border-radius:27px;background:#fff;color:#0A6FB0;
  font-size:19px;font-weight:800;letter-spacing:.12em;box-shadow:0 12px 28px rgba(6,40,80,.2)}
.lbl .f{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#0D1B2A;color:#FFC24D;font-size:18px;letter-spacing:0}
/* readable liquid glass: dark tint, bold white type */
.g{position:absolute;isolation:isolate;display:flex;align-items:center;gap:14px;color:#fff;font-weight:800;white-space:nowrap;letter-spacing:-.02em;
  background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(8,30,55,.48));
  box-shadow:0 22px 50px rgba(0,20,10,.35),inset 0 2px 1px rgba(255,255,255,.85),inset 0 -10px 24px rgba(255,255,255,.08),inset 0 0 0 1.5px rgba(255,255,255,.5);
  text-shadow:0 2px 8px rgba(0,0,0,.45)}
.g .ic{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:27px;color:#0D1B2A;text-shadow:none;flex:none;
  background:radial-gradient(circle at 32% 28%,#FFE3A3,#F5A623 60%,#D98200);box-shadow:inset 0 2px 2px rgba(255,255,255,.7),0 6px 14px rgba(0,0,0,.3)}
.amp{position:absolute;display:flex;align-items:center;gap:14px;color:#0D1B2A;font-weight:800;white-space:nowrap;letter-spacing:-.02em;
  background:linear-gradient(180deg,#FFC24D,#F5A623);box-shadow:0 18px 40px rgba(0,20,10,.35),inset 0 2px 1px rgba(255,255,255,.65)}
</style></head><body>
<div id="p">
  <div class="photo"></div>
  <div class="abs" style="left:0;right:0;top:0;height:440px;background:linear-gradient(180deg,rgba(10,70,130,.5),rgba(10,70,130,.25) 55%,rgba(10,70,130,0))"></div>
  <div class="abs" style="left:0;right:0;bottom:0;height:300px;background:linear-gradient(180deg,rgba(5,25,15,0),rgba(5,25,15,.5))"></div>
  <div class="lbl" style="left:48px;top:52px"><span class="f"><i class="ph-fill ph-cricket"></i></span>T20 WEEK · MELBOURNE FROM SAT</div>
  <div class="abs big" style="left:46px;top:134px">
    <div style="font-size:92px;font-weight:300">Eyes on the cricket.</div>
    <div style="font-size:92px;font-weight:800;margin-top:6px" class="am">We'll take the calls.</div></div>

  <div class="g" style="left:46px;top:800px;height:80px;padding:0 30px 0 13px;border-radius:40px;font-size:29px" data-lg='{"scale":-80,"chroma":5,"blur":8}'><span class="ic"><i class="ph-fill ph-phone-call"></i></span>Calls answered</div>
  <div class="g" style="left:46px;top:898px;height:80px;padding:0 30px 0 13px;border-radius:40px;font-size:29px" data-lg='{"scale":-80,"chroma":5,"blur":8}'><span class="ic"><i class="ph-fill ph-chat-circle-text"></i></span>Texts replied</div>
  <div class="g" style="left:46px;top:996px;height:80px;padding:0 30px 0 13px;border-radius:40px;font-size:29px" data-lg='{"scale":-80,"chroma":5,"blur":8}'><span class="ic"><i class="ph-fill ph-calendar-check"></i></span>Jobs booked in</div>

  <div class="amp" style="left:46px;top:1188px;height:88px;padding:0 34px;border-radius:44px;font-size:31px">Comment “DEMO”<i class="ph-fill ph-arrow-right"></i></div>
  <div class="abs" style="left:52px;top:1292px;font-size:20px;font-weight:600;text-shadow:0 1px 8px rgba(0,20,10,.6)">Free to get started · no hidden charges</div>
</div>
<script src="liquid-glass.js"></script>
<script>
(async () => {
  await document.fonts.ready;
  await new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = 'img/photo.jpg'; });
  document.querySelectorAll('.g').forEach(g => liquidGlass(g, JSON.parse(g.dataset.lg || '{}')));
  await new Promise(r => setTimeout(r, 400));
  document.body.dataset.ready = '1';
})();
</script></body></html>
