<!doctype html>
<html><head><meta charset="utf-8">
<!-- Kinetic-type reel, frame-matched to the owner's reference (one word per hit, cream/navy flip on every cut, accelerating).
     Pass 1 = "we don't just answer. we handle bookings, quotes …  lazy." → LazyTradie.
     Pass 2 (the looped track) = "you don't just work. you get time, weekends … relax." → LazyTradie end card + CTA.
     Deterministic: render.js calls renderAt(t). -->
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#v{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Outfit,sans-serif;font-weight:600;-webkit-font-smoothing:antialiased}
.bg{position:absolute;inset:0;visibility:hidden}
#cream{background:radial-gradient(ellipse 70% 45% at 88% 4%,#FAF7F0 0%,rgba(250,247,240,0) 100%),radial-gradient(ellipse 75% 45% at 8% 100%,#D9C9A9 0%,rgba(217,201,169,0) 100%),linear-gradient(180deg,#EFEBE1,#EAE4D8)}
#navy{background:radial-gradient(ellipse 60% 32% at 86% 3%,#353A3E 0%,rgba(53,58,62,0) 100%),radial-gradient(ellipse 80% 45% at 5% 100%,#030B16 0%,rgba(3,11,22,0) 100%),linear-gradient(180deg,#0E1E2F,#0A192A)}
#txt{position:absolute;left:0;top:0;width:1080px;text-align:center;white-space:nowrap;letter-spacing:-.025em}
#txt .l{display:block}
#logo{position:absolute;left:0;top:0;visibility:hidden}
#tag{position:absolute;left:0;right:0;top:1060px;text-align:center;font-weight:500;font-size:50px;letter-spacing:-.02em;color:#10131A;visibility:hidden}
#cta{position:absolute;top:1190px;left:0;height:104px;padding:0 48px;border-radius:52px;background:#0D1B2A;color:#F0EDE5;font-size:40px;font-weight:600;display:flex;align-items:center;gap:14px;visibility:hidden;letter-spacing:-.01em}
#dot{position:absolute;border-radius:50%;background:#F5A623;visibility:hidden}
</style></head><body>
<div id="v">
  <div class="bg" id="cream"></div><div class="bg" id="navy"></div>
  <div id="txt"></div>
  <img id="logo" src="img/wm_navy.png">
  <div id="dot"></div>
  <div id="tag">stress about work, not bookings.</div>
  <div id="cta">comment “DEMO” <span style="color:#F5A623">→</span></div>
</div>
<svg width="0" height="0" style="position:absolute">
  <filter id="warp" x="-30%" y="-60%" width="160%" height="220%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.009 0.03" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap id="wd" in="SourceGraphic" in2="n" scale="0" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="mb" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur id="mbg" stdDeviation="0 0"/></filter>
</svg>
<script src="cuts.js"></script>
<script>
const $ = id => document.getElementById(id);
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), P = (t, a, b) => cl((t - a) / (b - a)), lerp = (a, b, p) => a + (b - a) * p;
const eo = p => 1 - Math.pow(1 - p, 3), spr = (d, f = 2, z = 9) => d <= 0 ? 0 : 1 - Math.exp(-z * d) * Math.cos(2 * Math.PI * f * d);
const END = CUTS.end;
const INK = '#10131A', CRM = '#F0EDE5', AMB = '#F5A623';
// one continuous build (cuts.js): the reference's cut times up to its fast section, then a cut on every hit of the
// looped fast section, then the track's own ending into the only logo. Cream/navy flips on every cut.
// [words, fx]; words: string, or [small, big, bigColor] for the stacked two-size slots
const WORDS = [
  ['we', 'fade'], [['we,', 'don’t'], 'none'], ['just', 'slide'], [['just', 'answer', AMB], 'none'], ['we', 'grow'], ['handle', 'warp'], ['bookıngs', 'dot'],
  ['quotes', 'none'], ['invoices', 'none'], ['trust', 'blur'], ['speed', 'none'], ['schedules', 'blur'], ['growth', 'mblur'], ['cashflow', 'blur'], ['calendars', 'none'],
  ['customers', 'none'], ['job notes', 'mblur'], ['results', 'blur'], ['and', 'none'], ['you', 'grow'],
  [['you,', 'don’t'], 'none'], ['just', 'slide'], [['just', 'work', AMB], 'none'], ['you', 'grow'], ['get', 'warp'], ['tıme', 'dot'],
  ['back', 'none'], ['weekends', 'none'], ['footy', 'blur'], ['family', 'none'], ['headspace', 'blur'], ['sleep', 'mblur'], ['profit', 'blur'], ['holidays', 'none'],
  ['sanity', 'mblur'], ['control', 'blur'], ['re', 'none'], ['rel.', 'none'], ['rela', 'none'], ['relax.', 'none']];
if (WORDS.length !== CUTS.cuts.length) throw new Error('words ' + WORDS.length + ' vs cuts ' + CUTS.cuts.length);
const SLOTS = WORDS.map(([w, fx], i) => ({ t: CUTS.cuts[i], w, fx, i, len: (CUTS.cuts[i + 1] ?? CUTS.logo) - CUTS.cuts[i] }));
SLOTS.push({ t: CUTS.logo, w: 'LOGO', fx: 'end', i: WORDS.length, len: 9 });
const BASE = 220, MAXW = 900;
let measure = null;
function widthOf(text, size) { measure.style.fontSize = size + 'px'; measure.textContent = text; return measure.offsetWidth; }
function setText(s, t) {
  const el = $('txt'), dark = s.i % 2 === 1, col = dark ? CRM : INK;
  el.style.color = col; el.innerHTML = '';
  let lines = [];
  if (Array.isArray(s.w)) { const [sm, bg, bc] = s.w; const big = Math.min(bg.length <= 4 ? 395 : 330, BASE * 1.9, MAXW / (widthOf(bg, 100) / 100)); lines = [[sm, Math.round(big * (bg.length <= 4 ? .42 : .48)), col], [bg, Math.round(big), bc || col]]; }
  else { const size = Math.min(BASE, MAXW / (widthOf(s.w, 100) / 100)); lines = [[s.w, Math.round(size), col]]; }
  let h = 0; lines.forEach(([txt, size, c], k) => { const d = document.createElement('span'); d.className = 'l'; d.textContent = txt; d.style.fontSize = size + 'px'; d.style.color = c; d.style.lineHeight = k === 0 && lines.length > 1 ? '.78' : '1'; el.appendChild(d); });
  return lines;
}
let cur = -1;
function renderAt(t) {
  let k = 0; for (let j = 0; j < SLOTS.length; j++) if (t >= SLOTS[j].t - 1e-6) k = j;
  const s = SLOTS[k], lt = t - s.t, dark = s.i % 2 === 1;
  $('cream').style.visibility = dark ? 'hidden' : 'visible'; $('navy').style.visibility = dark ? 'visible' : 'hidden';
  const txt = $('txt'), logo = $('logo'), dot = $('dot');
  if (k !== cur) { cur = k; if (s.w !== 'LOGO') setText(s, t); }
  // reset per-frame state
  txt.style.filter = 'none'; txt.style.transform = 'none'; txt.style.opacity = 1; txt.style.visibility = 'visible';
  logo.style.visibility = 'hidden'; logo.style.filter = 'none'; dot.style.visibility = 'hidden'; $('tag').style.visibility = 'hidden'; $('cta').style.visibility = 'hidden';
  $('wd').setAttribute('scale', 0); $('mbg').setAttribute('stdDeviation', '0 0');
  if (s.w === 'LOGO') {
    txt.style.visibility = 'hidden';
    const W = 860, H = W * 196 / 1004; logo.style.width = W + 'px'; logo.style.visibility = 'visible';
    let y = 960 - H / 2;
    if (s.fx === 'end') {
      y = 880 - H / 2; const tg = $('tag'), pt = eo(P(lt, .12, .5)); tg.style.visibility = 'visible'; tg.style.opacity = pt; tg.style.transform = `translateY(${(1 - pt) * 24}px)`;
      const c = $('cta'), dc = t - CUTS.cta; if (dc >= 0) { c.style.visibility = 'visible'; const p = spr(dc, 1.8, 8); c.style.left = (540 - c.offsetWidth / 2) + 'px'; c.style.transform = `scale(${lerp(.6, 1, p).toFixed(3)})`; c.style.opacity = cl(dc / .08); }
      logo.style.transform = `translate(${540 - W / 2}px,${y}px) scale(${lerp(1.04, 1, eo(P(lt, 0, .4)))})`;
    } else {
      // reference: the logo warps away at +0.2 s and the frame goes empty at +0.3 s
      const wo = P(lt, .2, .3); if (lt >= .3) logo.style.visibility = 'hidden';
      if (wo > 0) { $('wd').setAttribute('scale', (wo * 70).toFixed(1)); logo.style.filter = 'url(#warp)'; }
      logo.style.transform = `translate(${540 - W / 2}px,${y}px)`;
    }
    return;
  }
  // centre the text block's ink on y = 960 (like the reference)
  const r = txt.getBoundingClientRect(), h = txt.offsetHeight;
  let x = 0, y = 960 - h / 2 + h * .03, sc = 1;
  switch (s.fx) {
    case 'fade': { const p = P(lt, 0, .12); txt.style.filter = p < 1 ? `blur(${((1 - p) * 14).toFixed(1)}px)` : 'none'; sc = lerp(.97, 1, eo(p)); break; }
    case 'blur': { const p = P(lt, 0, .1); txt.style.filter = p < 1 ? `blur(${((1 - p) * 16).toFixed(1)}px)` : 'none'; break; }
    case 'slide': { x = lerp(-150, 30, eo(P(lt, 0, Math.min(.6, s.len)))); break; }
    case 'grow': { sc = lerp(.32, 1, eo(P(lt, 0, .12))); break; }
    case 'warp': { const p = P(lt, 0, .12); if (p < 1) { $('wd').setAttribute('scale', ((1 - eo(p)) * 150).toFixed(1)); txt.style.filter = 'url(#warp)'; } break; }
    case 'mblur': { const p = P(lt, 0, .1); if (p < 1) { $('mbg').setAttribute('stdDeviation', `${((1 - p) * 22).toFixed(1)} 0`); txt.style.filter = 'url(#mb)'; x = (1 - eo(p)) * -30; } break; }
    case 'dot': {
      // the i's tittle is an amber dot that drops into place
      const span = txt.querySelector('.l'), idx = span.textContent.indexOf('ı');
      if (idx >= 0) {
        const rg = document.createRange(); rg.setStart(span.firstChild, idx); rg.setEnd(span.firstChild, idx + 1); const b = rg.getBoundingClientRect();
        const fs = parseFloat(span.style.fontSize), d = fs * .145, p = spr(lt, 2.2, 9);
        const cx = b.left + b.width / 2 + x, base = y + (b.top - r.top) + fs * .19;
        dot.style.visibility = 'visible'; dot.style.width = dot.style.height = d + 'px';
        dot.style.transform = `translate(${(cx - d / 2).toFixed(1)}px,${(lerp(base - 160, base, p) - d / 2).toFixed(1)}px)`;
      }
      break; }
  }
  txt.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) scale(${sc.toFixed(4)})`;
}
window.renderAt = renderAt; window.END = END;
(async () => {
  await document.fonts.load("600 200px Outfit"); await document.fonts.load("500 50px Outfit"); await document.fonts.ready;
  measure = document.createElement('span'); measure.style.cssText = 'position:absolute;left:-9999px;top:0;white-space:nowrap;font-weight:600;letter-spacing:-.025em;font-family:Outfit'; document.body.appendChild(measure);
  await new Promise(r => { const i = $('logo'); i.complete ? r() : i.onload = r; });
  renderAt(0); document.body.dataset.ready = '1';
})();
</script>
</body></html>
