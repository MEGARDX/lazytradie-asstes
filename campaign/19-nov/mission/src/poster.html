<!doctype html>
<html><head><meta charset="utf-8">
<!-- "NEW MISSION: NEVER MISS A CALL." (Thu 19 Nov, GTA VI launch day). 1080×1350. Owner's illustrated tradie duo on the ute at sunset.
     Original title type (Bungee, neon pink/amber edge), not the game's logo or font. No price today. -->
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Bungee&display=block" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter Tight',sans-serif;-webkit-font-smoothing:antialiased;background:#000}
#p{position:relative;width:1080px;height:1350px;overflow:hidden;color:#fff;background:#B55AC7}
.abs{position:absolute}
.photo{position:absolute;inset:0;background:url(img/duo.jpg) center top/1080px auto}
.kick{font-family:Bungee,sans-serif;font-size:44px;letter-spacing:.06em;color:#fff;text-shadow:0 0 14px rgba(255,80,190,.9),0 3px 0 #6b1d7a,0 6px 20px rgba(60,0,80,.5)}
.title{font-family:Bungee,sans-serif;font-size:118px;line-height:.92;letter-spacing:.01em;color:#FFC24D;
  -webkit-text-stroke:4px #3a0f4f;paint-order:stroke fill;
  text-shadow:0 0 24px rgba(255,80,190,.85),0 6px 0 #ff4fa3,0 12px 0 #6b1d7a,0 16px 34px rgba(40,0,60,.55)}
.g{position:absolute;isolation:isolate;display:flex;align-items:center;gap:14px;color:#fff;font-weight:800;white-space:nowrap;letter-spacing:-.02em;
  background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(60,15,80,.5));
  box-shadow:0 22px 50px rgba(30,0,40,.45),inset 0 2px 1px rgba(255,255,255,.85),inset 0 0 0 1.5px rgba(255,255,255,.5);text-shadow:0 2px 8px rgba(0,0,0,.45)}
.g .ic{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:27px;color:#0D1B2A;text-shadow:none;flex:none;
  background:radial-gradient(circle at 32% 28%,#FFE3A3,#F5A623 60%,#D98200);box-shadow:inset 0 2px 2px rgba(255,255,255,.7),0 6px 14px rgba(0,0,0,.3)}
.amp{position:absolute;display:flex;align-items:center;gap:14px;color:#0D1B2A;font-weight:800;white-space:nowrap;letter-spacing:-.02em;
  background:linear-gradient(180deg,#FFC24D,#F5A623);box-shadow:0 0 30px rgba(255,80,190,.4),0 18px 40px rgba(40,0,60,.45),inset 0 2px 1px rgba(255,255,255,.65)}
</style></head><body>
<div id="p">
  <div class="photo"></div>
  <div class="abs" style="left:0;right:0;top:0;height:400px;background:linear-gradient(180deg,rgba(70,20,100,.45),rgba(70,20,100,0))"></div>
  <div class="abs" style="left:0;right:0;bottom:0;height:330px;background:linear-gradient(180deg,rgba(40,10,60,0),rgba(40,10,60,.75))"></div>
  <div class="abs" style="left:0;right:0;top:46px;text-align:center"><div class="kick">NEW MISSION:</div></div>
  <div class="abs" style="left:0;right:0;top:112px;text-align:center"><div class="title">NEVER MISS<br>A CALL.</div></div>
  

  <div class="g" style="left:50px;top:1086px;height:78px;padding:0 30px 0 12px;border-radius:39px;font-size:27px" data-lg='{"scale":-80,"chroma":5,"blur":8}'><span class="ic"><i class="ph-fill ph-phone-call"></i></span>He's on the tools. <span style="color:#FFC24D">Ruby's got the calls.</span></div>
  <div class="amp" style="left:50px;top:1186px;height:88px;padding:0 34px;border-radius:44px;font-size:31px">Comment “DEMO”<i class="ph-fill ph-arrow-right"></i></div>
  <div class="abs" style="left:56px;top:1290px;font-size:20px;font-weight:600;text-shadow:0 1px 8px rgba(40,0,60,.6)">Free to get started · no hidden charges</div>
</div>
<script src="liquid-glass.js"></script>
<script>
(async () => {
  await document.fonts.ready;
  await new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = 'img/duo.jpg'; });
  document.querySelectorAll('.g').forEach(g => liquidGlass(g, JSON.parse(g.dataset.lg || '{}')));
  await new Promise(r => setTimeout(r, 400));
  document.body.dataset.ready = '1';
})();
</script></body></html>
