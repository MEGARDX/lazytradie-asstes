<!doctype html>
<html><head><meta charset="utf-8">
<!-- Admin Copilot card animation (after the Runway × Claude reference): a cream chat card floating over the scene.
     ui.html?t=<seconds> renders one frame (transparent), 1080×1920. Beat-aligned: steps tick on the music's beat grid. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=DM+Serif+Display&display=block" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent;font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}
#c{position:absolute;left:70px;width:940px;top:420px;border-radius:52px;background:#F7F4EE;box-shadow:0 50px 120px rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.04);
  padding:44px 44px 34px;color:#1f1c18;will-change:transform,opacity}
.hd{display:flex;align-items:center;justify-content:center;gap:16px;font-family:'DM Serif Display',serif;font-size:50px;color:#2b2722}
.orb{width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#FFE3A3,#F5A623 60%,#D98200);box-shadow:0 0 26px rgba(245,166,35,.55)}
.sub{text-align:center;font-size:21px;font-weight:600;color:#8a8278;margin-top:6px;letter-spacing:.02em}
.me{margin:30px 0 0 auto;width:fit-content;max-width:640px;background:#ECE6DB;border-radius:30px;padding:20px 26px;font-size:30px;font-weight:500;display:flex;align-items:center;gap:16px}
.me i{font-size:30px;color:#D98200}
.wave{display:flex;gap:4px;align-items:center;height:30px}
.wave b{width:5px;border-radius:3px;background:#D98200}
.steps{margin-top:26px;display:flex;flex-direction:column;gap:16px;min-height:10px}
.st{display:flex;align-items:center;gap:16px;font-size:27px;font-weight:500;color:#5a534a}
.st .ck{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:20px}
.st.done .ck{background:#E7F6EE;color:#22A85C}
.st.run .ck{border:3px solid #E7DFD2;border-top-color:#F5A623}
.st b{color:#1f1c18;font-weight:700}
.q{margin-top:24px;background:#fff;border-radius:34px;padding:26px 28px;box-shadow:0 10px 30px rgba(60,40,10,.10)}
.q .h{display:flex;justify-content:space-between;align-items:center;font-size:21px;font-weight:700;color:#8a8278;letter-spacing:.04em}
.q .r{display:flex;justify-content:space-between;align-items:flex-end;margin-top:12px}
.q .n{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.q .n small{display:block;font-size:22px;font-weight:600;color:#8a8278;margin-top:4px}
.q .p{font-size:62px;font-weight:800;letter-spacing:-.04em;line-height:1}
.q .p small{display:block;text-align:right;font-size:18px;font-weight:600;color:#8a8278;letter-spacing:0}
.btn{position:relative;margin-top:20px;height:84px;border-radius:42px;display:flex;align-items:center;justify-content:center;gap:12px;font-size:29px;font-weight:800;overflow:hidden}
.btn.am{background:linear-gradient(180deg,#FFC24D,#F5A623);color:#1f1c18}
.btn.ok{background:#22A85C;color:#fff}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.55)}
.bar{margin-top:26px;border-top:1.5px solid #E7DFD2;padding-top:20px;display:flex;align-items:center;gap:14px;font-size:24px;color:#a39b90}
.bar .pill{margin-left:auto;display:flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:22px;background:#ECE6DB;color:#5a534a;font-weight:700;font-size:20px}
.bar .mic{width:52px;height:52px;border-radius:50%;background:#F5A623;color:#1f1c18;display:grid;place-items:center;font-size:24px}
.hide{display:none}
</style></head><body>
<div id="c">
  <div class="hd"><span class="orb"></span>Good evening</div>
  <div class="sub">ADMIN COPILOT · TURNER ELECTRICAL</div>
  <div class="me" id="me"><i class="ph-fill ph-microphone"></i><div class="wave" id="wave"></div><span id="said"></span></div>
  <div class="steps" id="steps"></div>
  <div class="q hide" id="q">
    <div class="h"><span>QUOTE #1042 · DRAFT</span><span id="qs">READY FOR YOUR TAP</span></div>
    <div class="r"><div class="n">Switchboard upgrade<small>Dave R. · Coburg</small></div><div class="p">$2,450<small>incl. GST</small></div></div>
    <div class="btn am" id="btn"><i class="ph-fill ph-hand-tap"></i>Tap to confirm</div>
  </div>
  <div class="bar"><span>Say it or type it…</span><span class="pill"><span class="orb" style="width:22px;height:22px;box-shadow:none"></span>Admin Copilot</span><span class="mic"><i class="ph-fill ph-microphone"></i></span></div>
</div>
<script>
const T = parseFloat(new URLSearchParams(location.search).get('t') || '0');
const ease = x => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
const c = document.getElementById('c');
// card in
const k = ease(T / 0.55); c.style.opacity = k; c.style.transform = `translateY(${(1 - k) * 90}px) scale(${0.96 + 0.04 * k})`;
// voice bubble: waveform 0.45–1.2, then the words type out
const me = document.getElementById('me'), wave = document.getElementById('wave'), said = document.getElementById('said');
me.style.opacity = ease((T - 0.35) / 0.3);
const line = 'Quote the Smith job.';
if (T < 1.25) { for (let i = 0; i < 14; i++) { const b = document.createElement('b'); b.style.height = (8 + 20 * Math.abs(Math.sin(T * 9 + i * 1.3))) + 'px'; wave.appendChild(b); } }
else { wave.style.display = 'none'; said.textContent = line.slice(0, Math.round(line.length * Math.min(1, (T - 1.25) / 0.35))); }
// steps on the beat grid (beats at 1.67, 2.51, 3.35)
const S = [[1.67, 'Found the <b>Smith job</b> · Dave R., Coburg'], [2.51, 'Priced from <b>your rates</b>'], [3.35, 'Quote drafted · <b>$2,450</b>']];
const steps = document.getElementById('steps');
S.forEach(([at, txt]) => {
  if (T < at - 0.42) return;
  const d = document.createElement('div'); const done = T >= at;
  d.className = 'st ' + (done ? 'done' : 'run');
  d.innerHTML = `<span class="ck">${done ? '<i class="ph-bold ph-check"></i>' : ''}</span><span>${txt}</span>`;
  d.style.opacity = ease((T - (at - 0.42)) / 0.2);
  if (!done) d.querySelector('.ck').style.transform = `rotate(${T * 720}deg)`;
  steps.appendChild(d);
});
// quote card at 4.18, tap at 5.1, confirmed at 5.45
const q = document.getElementById('q');
if (T >= 4.18) { q.classList.remove('hide'); const e = ease((T - 4.18) / 0.35); q.style.opacity = e; q.style.transform = `translateY(${(1 - e) * 30}px)`; }
const btn = document.getElementById('btn');
if (T >= 5.1 && T < 5.45) { const r = document.createElement('span'); r.className = 'rip'; const s = 40 + 700 * ease((T - 5.1) / 0.35); r.style.cssText += `width:${s}px;height:${s}px;left:calc(50% - ${s/2}px);top:calc(50% - ${s/2}px);opacity:${1 - (T - 5.1) / 0.35}`; btn.appendChild(r); btn.style.transform = `scale(${0.97})`; }
if (T >= 5.45) { btn.className = 'btn ok'; btn.innerHTML = '<i class="ph-bold ph-check"></i>Confirmed · sent to Dave'; document.getElementById('qs').textContent = 'SENT'; const e = ease((T - 5.45) / 0.25); btn.style.transform = `scale(${1 + 0.04 * (1 - e)})`; }
document.fonts.ready.then(() => { document.body.dataset.ready = '1'; });
</script></body></html>
