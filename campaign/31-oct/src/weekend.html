<!doctype html>
<html><head><meta charset="utf-8">
<!-- LazyTradie Saturday Facebook group post, 1080×1350. -->
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&family=JetBrains+Mono:wght@600&display=block" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter Tight',sans-serif;-webkit-font-smoothing:antialiased;background:#000}
#weekend{position:relative;width:1080px;height:1350px;overflow:hidden;background:#0D1B2A}
.photo{position:absolute;inset:0;background:url(img/weekend.jpg) center/cover}
.sky{position:absolute;left:0;right:0;top:0;height:460px;background:linear-gradient(180deg,rgba(13,27,42,.22),rgba(13,27,42,0))}
.foot{position:absolute;left:0;right:0;bottom:0;height:260px;background:linear-gradient(0deg,rgba(13,27,42,.42),rgba(13,27,42,0))}
.wm{position:absolute;left:50%;top:40px;width:230px;transform:translateX(-50%)}
.hl{position:absolute;left:0;right:0;top:104px;text-align:center;color:#fff;line-height:.93;letter-spacing:-.045em;
  text-shadow:0 2px 24px rgba(13,27,42,.22)}
.hl .l1{display:block;font-size:90px;font-weight:300}
.hl .l2{display:block;font-size:104px;font-weight:600;letter-spacing:-.05em}
.sub{position:absolute;left:0;right:0;top:322px;text-align:center;color:#fff;font-size:35px;font-weight:400;letter-spacing:-.02em;
  text-shadow:0 2px 16px rgba(13,27,42,.3)}
.sub b{font-weight:600;color:#FFD27A}

.glass{position:absolute;isolation:isolate}
.glass.dark{background:linear-gradient(180deg,rgba(13,27,42,.30),rgba(13,27,42,.48));
  box-shadow:0 18px 40px rgba(0,0,0,.30),inset 0 1px 1px rgba(255,255,255,.6),inset 0 -8px 18px rgba(255,255,255,.07),inset 0 0 0 1px rgba(255,255,255,.22)}
.glass.light{background:linear-gradient(180deg,rgba(255,255,255,.66),rgba(255,255,255,.48));
  box-shadow:0 24px 50px rgba(13,27,42,.28),inset 0 1px 1px rgba(255,255,255,.95),inset 0 -10px 22px rgba(255,255,255,.3),inset 0 0 0 1px rgba(255,255,255,.7)}
.glass.amber{background:linear-gradient(180deg,rgba(255,196,84,.86),rgba(245,166,35,.86));
  box-shadow:0 22px 48px rgba(13,27,42,.40),inset 0 1px 1px rgba(255,255,255,.85),inset 0 -8px 18px rgba(184,116,0,.25),inset 0 0 0 1px rgba(255,255,255,.4)}

/* notification from the dashboard bell */
.note{left:676px;top:404px;width:372px;border-radius:26px;padding:18px 20px;color:#0D1B2A}
.note .top{display:flex;align-items:center;gap:10px;font-size:18px;color:#3a5169;font-weight:500}
.note .top img{width:30px;height:30px;border-radius:8px}
.note .top span{margin-left:auto;color:#6d859c;font-weight:400}
.note .t{margin-top:12px;font-size:25px;font-weight:600;letter-spacing:-.02em;display:flex;align-items:center;gap:9px}
.note .t i{color:#2FA57F;font-size:26px}
.note .m{margin-top:5px;font-size:20px;color:#3a5169;letter-spacing:-.01em;line-height:1.3}
.note .tp{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:14px;padding:3px 9px;border-radius:999px;margin-left:6px;
  background:rgba(93,202,165,.18);color:#1f8a68;border:1.5px solid rgba(47,165,127,.4);vertical-align:2px}

.chip{left:38px;height:62px;padding:0 24px 0 18px;border-radius:999px;display:flex;align-items:center;gap:12px;
  color:#fff;font-size:27px;font-weight:500;letter-spacing:-.02em;white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.25)}
.chip i{width:38px;height:38px;border-radius:50%;background:rgba(245,166,35,.95);color:#0D1B2A;display:grid;place-items:center;font-size:21px;text-shadow:none}

.cta{right:36px;bottom:44px;height:96px;padding:0 34px 0 40px;border-radius:999px;display:flex;align-items:center;gap:16px;color:#0D1B2A;white-space:nowrap}
.cta .a{font-size:40px;font-weight:700;letter-spacing:-.035em}
.cta .b{font-size:24px;font-weight:500;letter-spacing:-.01em;opacity:.85}
.cta .arr{width:54px;height:54px;border-radius:50%;background:#0D1B2A;color:#F5A623;display:grid;place-items:center;font-size:28px}
</style></head>
<body>
<div id="weekend">
  <div class="photo"></div><div class="sky"></div><div class="foot"></div>
  <img class="wm" src="img/wm_white.png" alt="">
  <div class="hl"><span class="l1">Run your whole trade</span><span class="l2">business with AI.</span></div>
  <div class="sub">Free to start. <b>Try it this weekend.</b></div>

  <div class="glass light note" data-lg='{"scale":-110,"chroma":6,"blur":6}'>
    <div class="top"><img src="img/icon.png" alt="">LazyTradie<span>just now</span></div>
    <div class="t"><i class="ph-fill ph-check-circle"></i>New job booked</div>
    <div class="m">Sarah M. · Power point install<br>Mon 9:00 AM <span class="tp">T1</span></div>
  </div>

  <div class="glass dark chip" style="top:668px" data-lg='{"scale":-70,"chroma":5,"blur":3}'><i class="ph-fill ph-phone-call"></i>Calls answered</div>
  <div class="glass dark chip" style="top:744px" data-lg='{"scale":-70,"chroma":5,"blur":3}'><i class="ph-fill ph-calendar-check"></i>Jobs booked</div>
  <div class="glass dark chip" style="top:820px" data-lg='{"scale":-70,"chroma":5,"blur":3}'><i class="ph-fill ph-microphone"></i>Quotes &amp; invoices by voice</div>

  <div class="glass amber cta" data-lg='{"scale":-100,"chroma":6,"blur":2}'>
    <div><div class="a">Try it free</div><div class="b">lazytradie.com.au</div></div>
    <span class="arr"><i class="ph-fill ph-arrow-right"></i></span>
  </div>
</div>
<script src="liquid-glass.js"></script>
<script>
(async function () {
  await document.fonts.ready;
  await Promise.all([].slice.call(document.images).map(function (i) {
    return i.complete ? 0 : new Promise(function (r) { i.onload = i.onerror = r; });
  }));
  var res = [];
  document.querySelectorAll('.glass').forEach(function (g) { res.push(liquidGlass(g, JSON.parse(g.dataset.lg || '{}')).supported); });
  document.body.dataset.glass = res.join(',');
  document.body.dataset.ready = '1';
})();
</script>
</body></html>
