<!doctype html>
<html><head><meta charset="utf-8">
<!-- AI Receptionist $49 poster. poster.html?f=story (1080×1920) | feed (1080×1350). Light liquid glass. -->
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&display=block" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
:root{--navy:#0D1B2A;--am:#F5A623}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter Tight',sans-serif;-webkit-font-smoothing:antialiased;background:#000}
#p{position:relative;width:1080px;overflow:hidden;background:#4fb3e8}
.ph0{position:absolute;inset:0;background:url(img/hero.jpg) center top/cover}
.g{position:absolute;isolation:isolate;
  background:linear-gradient(180deg,rgba(255,255,255,.58),rgba(255,255,255,.36));
  box-shadow:0 26px 60px rgba(13,27,42,.22),0 2px 6px rgba(13,27,42,.08),
    inset 0 1.5px 1px rgba(255,255,255,.95),inset 0 -10px 24px rgba(255,255,255,.3),inset 0 0 0 1px rgba(255,255,255,.75)}
.hl{position:absolute;left:44px;color:#fff;letter-spacing:-.05em;line-height:.9;text-shadow:0 2px 30px rgba(13,40,70,.18)}
.hl .a{display:block;font-weight:300}
.hl .b{display:block;font-weight:600}
.chip{left:40px;height:76px;padding:0 26px 0 12px;border-radius:38px;display:flex;align-items:center;gap:14px;
  font-size:27px;font-weight:500;color:var(--navy);letter-spacing:-.02em;white-space:nowrap}
.chip .ic{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:27px;color:#fff;
  background:linear-gradient(145deg,#FFC24D,#F5A623 55%,#E08A00);box-shadow:inset 0 1px 1px rgba(255,255,255,.7),0 6px 14px rgba(224,138,0,.35)}
.chip .ck{color:#12b886;font-size:26px;margin-left:4px}
.card{left:36px;right:36px;border-radius:44px;padding:34px 38px;color:var(--navy)}
.k{font-size:20px;font-weight:600;letter-spacing:.14em;color:#3a5169}
.price{display:flex;align-items:flex-end;gap:14px;margin-top:8px}
.price .n{font-size:170px;font-weight:600;letter-spacing:-.06em;line-height:.82;
  background:linear-gradient(100deg,#0D1B2A 10%,#0D1B2A 45%,#E08A00 80%);-webkit-background-clip:text;color:transparent}
.price .m{font-size:36px;font-weight:500;padding-bottom:14px}
.price .tri{margin-left:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:8px;font-size:25px;font-weight:500}
.price .tri i{color:#12b886;margin-right:8px}
.sub{font-size:27px;margin-top:20px;letter-spacing:-.02em;color:#24384c}
.foot{display:flex;align-items:center;justify-content:space-between;margin-top:24px}
.cta{height:72px;padding:0 30px;border-radius:36px;display:flex;align-items:center;gap:12px;font-size:25px;font-weight:600;color:#1a1206;
  background:linear-gradient(180deg,#FFC655,#F5A623);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.8),0 12px 28px rgba(224,138,0,.4)}
.tag{right:40px;height:62px;padding:0 22px;border-radius:31px;display:flex;align-items:center;gap:10px;font-size:22px;font-weight:600;color:var(--navy);letter-spacing:-.01em}
.tag .dot{width:12px;height:12px;border-radius:50%;background:#12b886;box-shadow:0 0 0 5px rgba(18,184,134,.18)}
</style></head><body>
<div id="p">
  <div class="ph0"></div>
  <div class="hl" id="hl"><span class="a">The</span><span class="b">AI Receptionist</span></div>
  <div class="g tag" id="tag"><span class="dot"></span>Made for Aussie tradies</div>
  <div class="g chip" id="c1"><span class="ic"><i class="ph-fill ph-phone-call"></i></span>Answers calls<i class="ph-fill ph-check-circle ck"></i></div>
  <div class="g chip" id="c2"><span class="ic"><i class="ph-fill ph-chat-circle-text"></i></span>Replies to SMS<i class="ph-fill ph-check-circle ck"></i></div>
  <div class="g chip" id="c3"><span class="ic"><i class="ph-fill ph-globe"></i></span>Handles website enquiries<i class="ph-fill ph-check-circle ck"></i></div>
  <div class="g card" id="card">
    <div class="k">CALLS · SMS · WEBSITE &nbsp;—&nbsp; ALL THREE, ONE PRICE</div>
    <div class="price"><span class="n">$49</span><span class="m">/month</span>
      <div class="tri"><span><i class="ph-fill ph-check-circle"></i>Calls</span><span><i class="ph-fill ph-check-circle"></i>SMS</span><span><i class="ph-fill ph-check-circle"></i>Website</span></div></div>
    <div class="sub">Every enquiry answered and booked in. Never miss a job again.</div>
    <div class="foot"><img src="img/wm_navy.png" style="width:230px"><div class="cta">lazytradie.com.au<i class="ph-fill ph-arrow-right"></i></div></div>
  </div>
</div>
<script src="liquid-glass.js"></script>
<script>
const f = new URLSearchParams(location.search).get('f') || 'story';
const S = f === 'story'
  ? { H: 1920, bg: 'center top', hl: [70, 66, 128], tag: 300, chips: [700, 792, 884], card: 1388 }
  : { H: 1350, bg: 'center 16%', hl: [44, 54, 104], tag: 236, chips: [742, 828, 914], card: 1040 };
const $ = id => document.getElementById(id);
$('p').style.height = S.H + 'px';
document.querySelector('.ph0').style.backgroundPosition = S.bg;
$('hl').style.top = S.hl[0] + 'px'; $('hl').querySelector('.a').style.fontSize = S.hl[1] + 'px'; $('hl').querySelector('.b').style.fontSize = S.hl[2] + 'px';
$('tag').style.top = S.tag + 'px';
['c1', 'c2', 'c3'].forEach((id, i) => $(id).style.top = S.chips[i] + 'px');
$('card').style.top = S.card + 'px';
if (f !== 'story') { $('card').style.padding = '26px 34px'; document.querySelector('.price .n').style.fontSize = '132px'; document.querySelector('.sub').style.display = 'none'; }
(async () => {
  await document.fonts.ready;
  await new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = 'img/hero.jpg'; });
  document.querySelectorAll('.g').forEach(el => liquidGlass(el, el.id === 'card' ? { scale: -140, chroma: 7, blur: 8, border: .05 } : { scale: -90, chroma: 6, blur: 3 }));
  document.body.dataset.ready = '1';
})();
</script></body></html>
