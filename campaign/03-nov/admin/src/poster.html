<!doctype html>
<html><head><meta charset="utf-8">
<!-- "AI Admin Tool for Tradies" poster, 1080×1350. Same system as the A$49 carousel (03-nov/scam):
     big white type on a vivid gradient, glossy spheres, solid white card + amber pills, glass only on feature chips.
     Palette: emerald (the Copilot's colour) + white + amber. -->
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700;800&display=block" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
:root{--ink:#0B5E3B;--am:#F29A00}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter Tight',sans-serif;-webkit-font-smoothing:antialiased;background:#000}
#p{position:relative;width:1080px;height:1350px;overflow:hidden;color:#fff;
  background:radial-gradient(110% 70% at 12% 0%,rgba(156,237,191,.5) 0%,rgba(156,237,191,0) 58%),linear-gradient(165deg,#30C482 0%,#1FA56A 52%,#138556 100%)}
.abs{position:absolute}
.sph{position:absolute;border-radius:50%;background:radial-gradient(circle at 32% 28%,#FFE3A3 0%,#FFC24D 22%,#F5A623 55%,#D98200 100%);
  box-shadow:inset -20px -30px 60px rgba(160,80,0,.35),0 40px 80px rgba(6,70,40,.28)}
.wsp{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0%,#F0FFF6 40%,#BFF0D4 100%);
  box-shadow:inset -14px -22px 40px rgba(31,165,106,.28),0 30px 60px rgba(6,70,40,.22)}
.ring{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.35)}
.big{letter-spacing:-.055em;line-height:.88}
.card{position:absolute;background:#fff;color:var(--ink);box-shadow:0 30px 70px rgba(6,70,40,.3)}
.amp{position:absolute;display:flex;align-items:center;gap:14px;color:#fff;font-weight:700;white-space:nowrap;
  background:linear-gradient(180deg,#FFB52E,#F29A00);box-shadow:0 16px 36px rgba(160,80,0,.35),inset 0 2px 1px rgba(255,255,255,.6);text-shadow:0 1px 3px rgba(150,70,0,.35)}
.wp{position:absolute;display:flex;align-items:center;gap:12px;background:#fff;color:var(--ink);font-weight:700;white-space:nowrap;box-shadow:0 14px 30px rgba(6,70,40,.25)}
.a{color:var(--am)}
#chips{position:absolute;left:58px;right:58px;top:968px;display:flex;flex-wrap:wrap;gap:18px}
.g{position:relative;isolation:isolate;height:92px;padding:0 32px 0 13px;border-radius:46px;display:flex;align-items:center;gap:16px;
  font-size:33px;font-weight:700;letter-spacing:-.02em;color:#fff;white-space:nowrap;
  background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(6,90,55,.30));
  box-shadow:0 22px 50px rgba(6,70,40,.3),inset 0 2px 1px rgba(255,255,255,.95),inset 0 -12px 26px rgba(255,255,255,.14),inset 0 0 0 1.5px rgba(255,255,255,.6);
  text-shadow:0 2px 8px rgba(6,70,40,.35)}
.g .ic{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;font-size:33px;color:#fff;text-shadow:none;
  background:radial-gradient(circle at 32% 28%,#FFE3A3,#F5A623 60%,#D98200);box-shadow:inset 0 2px 2px rgba(255,255,255,.7),0 8px 18px rgba(160,80,0,.35)}
</style></head><body>
<div id="p">
  <!-- graphics, kept clear of the type -->
  <div class="sph" style="right:-120px;top:430px;width:400px;height:400px"></div>
  <div class="ring" style="right:-180px;top:370px;width:520px;height:520px"></div>
  <div class="wsp" style="right:70px;top:90px;width:150px;height:150px"></div>
  <div class="wsp" style="right:300px;top:860px;width:84px;height:84px"></div>

  <div class="wp" style="left:64px;top:84px;height:64px;padding:0 26px 0 20px;border-radius:32px;font-size:25px"><i class="ph-fill ph-sparkle a"></i>Admin Copilot</div>
  <div class="abs big" style="left:58px;top:196px;text-shadow:0 4px 30px rgba(6,70,40,.2)">
    <div style="font-size:132px;font-weight:300">AI Admin Tool</div>
    <div style="font-size:132px;font-weight:800">for Tradies.</div></div>

  <div class="card" style="left:58px;top:470px;width:650px;height:290px;border-radius:60px;display:flex;flex-direction:column;justify-content:center;padding:0 50px">
    <div style="font-size:44px;font-weight:600;letter-spacing:-.02em">and it's</div>
    <div class="big" style="font-size:210px;font-weight:800;line-height:.84">FREE<span class="a">.</span></div></div>
  <div class="amp" style="left:58px;top:800px;height:110px;padding:0 44px 0 16px;border-radius:55px;font-size:50px;letter-spacing:-.03em">
    <span style="width:80px;height:80px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--am);font-size:42px;text-shadow:none"><i class="ph-fill ph-microphone"></i></span>All by your voice</div>

  <div id="chips">
    <div class="g" data-lg='{"scale":-100,"chroma":6,"blur":4}'><span class="ic"><i class="ph-fill ph-file-text"></i></span>Quotes</div>
    <div class="g" data-lg='{"scale":-100,"chroma":6,"blur":4}'><span class="ic"><i class="ph-fill ph-receipt"></i></span>Invoices</div>
    <div class="g" data-lg='{"scale":-100,"chroma":6,"blur":4}'><span class="ic"><i class="ph-fill ph-toolbox"></i></span>Jobs</div>
    <div class="g" data-lg='{"scale":-100,"chroma":6,"blur":4}'><span class="ic"><i class="ph-fill ph-clock-clockwise"></i></span>Schedule</div>
    <div class="g" data-lg='{"scale":-100,"chroma":6,"blur":4}'><span class="ic"><i class="ph-fill ph-calendar-check"></i></span>Calendar</div>
    <div class="g" data-lg='{"scale":-100,"chroma":6,"blur":4}'><span class="ic"><i class="ph-fill ph-users-three"></i></span>Staff &amp; dispatch</div>
  </div>

  <img class="abs" src="img/wm_white.png" style="left:62px;top:1222px;width:340px;filter:drop-shadow(0 4px 14px rgba(6,70,40,.35))">
  <div class="amp" style="right:58px;top:1208px;height:96px;padding:0 38px;border-radius:48px;font-size:30px">lazytradie.com.au<i class="ph-fill ph-arrow-right"></i></div>
</div>
<script src="liquid-glass.js"></script>
<script>
(async () => {
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
  document.querySelectorAll('.g').forEach(el => liquidGlass(el, JSON.parse(el.dataset.lg || '{}')));
  document.body.dataset.ready = '1';
})();
</script></body></html>
