<!doctype html>
<html><head><meta charset="utf-8">
<!-- Admin Copilot "Just say it" poster. poster.html?f=feed (1080×1350) | story (1080×1920). -->
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=block" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
:root{--navy:#0D1B2A;--am:#F5A623;--bg:rgb(190,111,5)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter Tight',sans-serif;-webkit-font-smoothing:antialiased;background:#000}
#p{position:relative;width:1080px;overflow:hidden;background:var(--bg);color:#fff}
#ph{position:absolute;left:0;width:1080px;height:1341px;background:url(img/mic.jpg) center/cover}
#seam{position:absolute;left:0;width:1080px;height:160px;background:linear-gradient(var(--bg),rgba(190,111,5,0))}
.g{position:absolute;isolation:isolate;
  background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(13,27,42,.34));
  box-shadow:0 26px 60px rgba(60,30,0,.28),0 2px 6px rgba(0,0,0,.08),
    inset 0 1.5px 1px rgba(255,255,255,.9),inset 0 -10px 24px rgba(255,255,255,.12),inset 0 0 0 1px rgba(255,255,255,.55);
  text-shadow:0 1px 8px rgba(0,0,0,.22)}
#hl{position:absolute;left:50px;line-height:.86;letter-spacing:-.055em;text-shadow:0 2px 30px rgba(90,40,0,.2)}
#hl .a{display:block;font-weight:300;font-size:128px}
#hl .b{display:block;font-weight:700;font-size:164px}
#free{left:44px;height:104px;border-radius:52px;padding:0 34px 0 12px;display:flex;align-items:center;gap:18px}
#free .f{height:80px;padding:0 26px;border-radius:40px;background:#fff;color:var(--navy);font-size:50px;font-weight:800;letter-spacing:-.02em;
  display:flex;align-items:center;text-shadow:none;box-shadow:0 8px 22px rgba(0,0,0,.18)}
#free .t{font-size:27px;font-weight:600;line-height:1.15}
#free .t span{display:block;font-size:20px;font-weight:400;opacity:.9}
#voice{left:44px;width:500px;border-radius:30px;padding:20px 24px}
#voice .top{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:600;letter-spacing:.06em}
#voice .top i{width:36px;height:36px;border-radius:50%;background:var(--am);display:grid;place-items:center;font-size:19px;color:#fff}
#wave{display:flex;align-items:center;gap:4px;height:36px;margin-left:auto}
#wave b{width:4px;border-radius:2px;background:#fff}
#voice .q{font-size:25px;font-style:italic;line-height:1.25;margin-top:12px;letter-spacing:-.01em}
#quote{left:44px;width:470px;border-radius:30px;padding:22px 24px}
#quote .h{display:flex;align-items:center;justify-content:space-between;font-size:24px;font-weight:600}
#quote .h span{font-size:15px;font-weight:600;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.22);letter-spacing:.06em}
#quote .s{font-size:19px;opacity:.88;margin-top:3px}
#quote .li{display:flex;justify-content:space-between;font-size:21px;margin-top:10px;opacity:.95}
#quote .tot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.3)}
#quote .tot b{font-size:48px;font-weight:700;letter-spacing:-.04em;line-height:1}
#quote .btn{height:58px;padding:0 22px;border-radius:29px;background:linear-gradient(180deg,#FFC655,#F5A623);color:#1a1206;font-size:21px;font-weight:700;
  display:flex;align-items:center;gap:8px;text-shadow:none;box-shadow:inset 0 1.5px 1px rgba(255,255,255,.8),0 10px 24px rgba(120,60,0,.35)}
#bar{background:linear-gradient(180deg,rgba(13,27,42,.32),rgba(13,27,42,.58));left:36px;right:36px;height:118px;border-radius:40px;padding:0 34px;display:flex;align-items:center;justify-content:space-between}
#bar .t{font-size:30px;font-weight:700;letter-spacing:-.02em}
#bar .t span{display:block;font-size:21px;font-weight:400;margin-top:2px}
</style></head><body>
<div id="p">
  <div id="ph"></div><div id="seam"></div>
  <div id="hl"><span class="a">Just</span><span class="b">say it.</span></div>
  <div class="g" id="free"><div class="f">FREE</div><div class="t">to get started<span>No hidden charges</span></div></div>
  <div class="g" id="voice"><div class="top"><i class="ph-fill ph-microphone"></i>YOU SAY<div id="wave"></div></div>
    <div class="q">“Quote the Smith job, two downlights and a power point.”</div></div>
  <div class="g" id="quote"><div class="h">Quote · Smith<span>READY</span></div><div class="s">Richmond · your prices, your terms</div>
    <div class="li"><span>Downlights × 2</span><span>$240</span></div><div class="li"><span>Power point</span><span>$140</span></div>
    <div class="tot"><b>$380</b><div class="btn">Confirm &amp; send<i class="ph-fill ph-arrow-right"></i></div></div></div>
  <div class="g" id="bar"><div class="t">Admin Copilot<span>Quotes, invoices and bookings, by voice.</span></div><img src="img/wm_white.png" style="width:230px"></div>
</div>
<script src="liquid-glass.js"></script>
<script>
const f = new URLSearchParams(location.search).get('f') || 'feed';
const S = f === 'story'
  ? { H: 1920, ph: 579, hl: 150, free: 520, voice: 800, quote: 1170, bar: 1770 }
  : { H: 1350, ph: 0, hl: 64, free: 382, voice: 528, quote: 790, bar: 1196 };
const $ = id => document.getElementById(id);
$('p').style.height = S.H + 'px'; $('ph').style.top = S.ph + 'px';
$('seam').style.top = S.ph + 'px'; $('seam').style.display = S.ph ? 'block' : 'none';
['hl', 'free', 'voice', 'quote', 'bar'].forEach(k => $(k).style.top = S[k] + 'px');
$('wave').innerHTML = [...Array(16)].map((_, i) => `<b style="height:${8 + Math.abs(Math.sin(i * 1.3) * Math.sin(i * .5 + 1)) * 28}px"></b>`).join('');
(async () => {
  await document.fonts.ready;
  await new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = 'img/mic.jpg'; });
  document.querySelectorAll('.g').forEach(el => liquidGlass(el, el.id === 'bar' || el.id === 'quote' ? { scale: -130, chroma: 7, blur: 7 } : { scale: -100, chroma: 6, blur: 4 }));
  document.body.dataset.ready = '1';
})();
</script></body></html>
