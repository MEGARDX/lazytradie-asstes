<!doctype html>
<html><head><meta charset="utf-8">
<!-- Sandown 500 race-day poster (Sun 8 Nov), 1080×1350. Blonde influencer trackside.
     Event named in our own text only: no Supercars/Sandown logos. Blue / white / amber, solid chips for legibility. -->
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700;800&display=block" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter Tight',sans-serif;-webkit-font-smoothing:antialiased;background:#000}
#p{position:relative;width:1080px;height:1350px;overflow:hidden;color:#fff;background:#6FB8E8}
.abs{position:absolute}
.photo{position:absolute;inset:0;background:url(img/photo.jpg) center top/1088px auto}
.big{letter-spacing:-.05em;line-height:.95;text-shadow:0 3px 24px rgba(6,60,110,.35)}
.lbl{position:absolute;display:flex;align-items:center;gap:12px;height:58px;padding:0 24px 0 16px;border-radius:29px;background:#fff;color:#0A6FB0;
  font-size:21px;font-weight:800;letter-spacing:.12em;box-shadow:0 12px 28px rgba(6,60,110,.25)}
.lbl .f{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#0D1B2A;color:#fff;font-size:20px;letter-spacing:0}
.ch{position:absolute;left:52px;display:flex;align-items:center;gap:14px;height:74px;padding:0 28px 0 12px;border-radius:37px;background:#fff;color:#0D1B2A;
  font-size:27px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;box-shadow:0 14px 32px rgba(6,60,110,.25)}
.ch .i{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:26px;color:#0D1B2A;
  background:radial-gradient(circle at 32% 28%,#FFE3A3,#F5A623 60%,#D98200)}
.amp{position:absolute;display:flex;align-items:center;gap:14px;color:#0D1B2A;font-weight:800;white-space:nowrap;letter-spacing:-.02em;
  background:linear-gradient(180deg,#FFC24D,#F5A623);box-shadow:0 18px 40px rgba(6,60,110,.35),inset 0 2px 1px rgba(255,255,255,.65)}
</style></head><body>
<div id="p">
  <div class="photo"></div>
  <div class="abs" style="left:0;right:0;top:0;height:420px;background:linear-gradient(180deg,rgba(10,90,160,.32),rgba(10,90,160,0))"></div>
  <div class="abs" style="left:0;width:620px;bottom:0;height:420px;background:linear-gradient(180deg,rgba(13,27,42,0),rgba(13,27,42,.45))"></div>

  <div class="lbl" style="left:52px;top:52px"><span class="f"><i class="ph-fill ph-flag-checkered"></i></span>SANDOWN 500 · SUN 8 NOV</div>
  <div class="abs big" style="left:50px;top:140px">
    <div style="font-size:94px;font-weight:300">Eyes on the track.</div>
    <div style="font-size:94px;font-weight:800;margin-top:4px">We'll take <span style="color:#FFC24D;text-shadow:0 3px 18px rgba(120,60,0,.35)">the calls.</span></div></div>

  <div class="ch" style="top:362px"><span class="i"><i class="ph-fill ph-phone-call"></i></span>Calls answered</div>
  <div class="ch" style="top:450px"><span class="i"><i class="ph-fill ph-chat-circle-text"></i></span>Texts replied</div>
  <div class="ch" style="top:538px"><span class="i"><i class="ph-fill ph-calendar-check"></i></span>Jobs booked in</div>

  <div class="abs" style="left:52px;top:1036px;line-height:1;background:#fff;color:#0A6FB0;padding:16px 26px 18px;border-radius:28px;box-shadow:0 18px 40px rgba(6,60,110,.3)">
    <div style="font-size:20px;font-weight:700;opacity:.75">Starts at</div>
    <div style="font-size:60px;font-weight:800;letter-spacing:-.05em">A$<span style="color:#F29A00">49</span><span style="font-size:24px;font-weight:600;letter-spacing:-.02em">/month</span></div></div>
  <div class="amp" style="left:52px;top:1176px;height:90px;padding:0 34px;border-radius:45px;font-size:31px">Comment “DEMO”<i class="ph-fill ph-arrow-right"></i></div>
</div>
<script>
(async () => {
  await document.fonts.ready;
  await new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = 'img/photo.jpg'; });
  await new Promise(r => setTimeout(r, 300));
  document.body.dataset.ready = '1';
})();
</script></body></html>
