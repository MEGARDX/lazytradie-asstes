<!doctype html>
<html><head><meta charset="utf-8">
<!-- "Perfect innings." cricket scoreboard post (Sat 14 Nov, ahead of the 2nd ODI in Adelaide). 1080×1350 feed + 1080×1920 story. poster.html?f=feed|story
     Old-school ground scoreboard in brand navy/amber with dot-matrix numerals. Figures are illustrative (labelled). No team or competition logos. -->
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700;800&family=Doto:wght@800;900&display=block" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
:root{--navy:#0D1B2A;--am:#F5A623}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter Tight',sans-serif;-webkit-font-smoothing:antialiased;background:#000}
#p{position:relative;width:1080px;height:1350px;overflow:hidden;color:#fff;
  background:radial-gradient(70% 40% at 50% 0%,rgba(255,255,255,.4),rgba(255,255,255,0) 70%),linear-gradient(180deg,#3DB3F2 0%,#1C93DD 55%,#0F7CC4 100%)}
.story #p{height:1920px}
.abs{position:absolute}
.big{letter-spacing:-.05em;line-height:.95;text-shadow:0 3px 24px rgba(6,60,110,.3)}
.am{color:#FFC24D;text-shadow:0 3px 18px rgba(120,60,0,.35)}
.lbl{position:absolute;display:flex;align-items:center;gap:12px;height:56px;padding:0 24px 0 14px;border-radius:28px;background:#fff;color:#0A6FB0;
  font-size:20px;font-weight:800;letter-spacing:.12em;box-shadow:0 12px 28px rgba(6,60,110,.25)}
.lbl .f{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#0D1B2A;color:#FFC24D;font-size:19px;letter-spacing:0}
/* scoreboard */
.board{position:absolute;left:60px;right:60px;border-radius:26px;padding:16px;
  background:linear-gradient(180deg,#2a3b50,#14212f);box-shadow:0 40px 80px rgba(6,40,80,.45),inset 0 2px 0 rgba(255,255,255,.12)}
.inner{border-radius:16px;background:#0A1622;padding:26px 34px 30px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.06),inset 0 10px 30px rgba(0,0,0,.5)}
.top{display:flex;justify-content:space-between;align-items:center;padding-bottom:18px;border-bottom:2px dashed rgba(255,255,255,.12)}
.top .t{display:flex;align-items:center;gap:14px;font-size:30px;font-weight:800;letter-spacing:.04em}
.top .t img{width:46px;height:46px}
.no{font-family:Doto,monospace;font-size:34px;font-weight:900;color:#FFC24D;letter-spacing:.06em;text-shadow:0 0 14px rgba(255,194,77,.6)}
.row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:2px dashed rgba(255,255,255,.08)}
.row:last-child{border-bottom:0}
.row .k{font-size:30px;font-weight:700;letter-spacing:.08em;color:#cfd8e2}
.row .k small{display:block;font-size:18px;font-weight:600;letter-spacing:.04em;color:#7d8b99;margin-top:4px}
.row .v{font-family:Doto,monospace;font-size:92px;font-weight:900;line-height:.9;color:#fff;letter-spacing:.04em;text-shadow:0 0 18px rgba(255,255,255,.45)}
.row .v.am2{color:#FFC24D;text-shadow:0 0 18px rgba(255,194,77,.6)}
.row .v.rd{color:#ff6b6b;text-shadow:0 0 18px rgba(255,107,107,.55)}
.row .v.gr{color:#4ade80;text-shadow:0 0 18px rgba(74,222,128,.5)}
.bolts{position:absolute;width:12px;height:12px;border-radius:50%;background:#56677a;box-shadow:inset 0 1px 1px rgba(255,255,255,.4)}
.ball{position:absolute;width:150px;height:150px;border-radius:50%;overflow:hidden;
  background:radial-gradient(circle at 34% 30%,#ff8a7a 0%,#d62828 35%,#8e1515 75%,#5c0b0b 100%);box-shadow:0 26px 50px rgba(80,10,10,.45),inset -10px -14px 26px rgba(0,0,0,.35)}
.ball:before{content:'';position:absolute;left:36%;top:-4%;width:28%;height:108%;border-radius:50%;
  border-left:3px dashed rgba(255,240,220,.9);border-right:3px dashed rgba(255,240,220,.9)}
.ball:after{content:'';position:absolute;left:44%;top:0;width:12%;height:100%;border-radius:50%;background:rgba(120,10,10,.35)}
.amp{position:absolute;display:flex;align-items:center;gap:14px;color:var(--navy);font-weight:800;white-space:nowrap;letter-spacing:-.02em;
  background:linear-gradient(180deg,#FFC24D,#F5A623);box-shadow:0 18px 40px rgba(6,60,110,.3),inset 0 2px 1px rgba(255,255,255,.65)}
</style></head><body>
<div id="p">
  <div class="lbl" id="lbl" style="left:60px;top:56px"><span class="f"><i class="ph-fill ph-cricket"></i></span>ODI WEEKEND · AUS v ENG</div>
  <div class="abs big" id="hl" style="left:58px;top:140px">
    <div style="font-size:100px;font-weight:800">Perfect innings.</div>
    <div style="font-size:56px;font-weight:400;margin-top:12px;letter-spacing:-.035em">While you <span class="am" style="font-weight:700">watch the cricket.</span></div></div>
  <div class="ball" id="ball" style="right:42px;top:96px;transform:rotate(-24deg)"></div>

  <div class="board" id="board" style="top:400px">
    <span class="bolts" style="left:6px;top:6px"></span><span class="bolts" style="right:6px;top:6px"></span><span class="bolts" style="left:6px;bottom:6px"></span><span class="bolts" style="right:6px;bottom:6px"></span>
    <div class="inner">
      <div class="top"><span class="t"><img src="img/icon.png">LAZYTRADIE</span><span class="no">NOT OUT</span></div>
      <div class="row"><span class="k">CALLS</span><span class="v">12</span></div>
      <div class="row"><span class="k">ANSWERED</span><span class="v gr">12</span></div>
      <div class="row"><span class="k">MISSED</span><span class="v rd">0</span></div>
      <div class="row"><span class="k">JOBS BOOKED<small>STRAIGHT INTO YOUR CALENDAR</small></span><span class="v am2">7</span></div>
      <div class="row"><span class="k">WAITING FOR YOUR OK<small>BIG JOBS · $1,000+</small></span><span class="v am2">2</span></div>
    </div>
  </div>

  <div class="amp" id="cta" style="left:60px;bottom:58px;height:90px;padding:0 34px;border-radius:45px;font-size:31px">Comment “DEMO”<i class="ph-fill ph-arrow-right"></i></div>
  <div class="abs" id="pr" style="right:60px;bottom:50px;text-align:right;line-height:1;background:#fff;color:#0A6FB0;padding:16px 26px 18px;border-radius:28px;box-shadow:0 18px 40px rgba(6,60,110,.3)">
    <div style="font-size:20px;font-weight:700;opacity:.75">Starts at</div>
    <div style="font-size:58px;font-weight:800;letter-spacing:-.05em">A$<span style="color:#F29A00">49</span><span style="font-size:24px;font-weight:600;letter-spacing:-.02em">/month</span></div></div>
  <div class="abs" id="ex" style="left:0;right:0;bottom:18px;text-align:center;font-size:15px;font-weight:600;opacity:.75">Example figures · demo account</div>
</div>
<script>
(async () => {
  const f = new URLSearchParams(location.search).get('f') || 'feed';
  if (f === 'story') {
    document.body.classList.add('story');
    const mv = (id, prop, v) => document.getElementById(id).style[prop] = v;
    mv('lbl', 'top', '230px'); mv('hl', 'top', '314px'); mv('ball', 'top', '270px'); mv('board', 'top', '640px');
    mv('cta', 'bottom', '300px'); mv('pr', 'bottom', '292px'); mv('ex', 'bottom', '262px');
  }
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
  await new Promise(r => setTimeout(r, 300));
  document.body.dataset.ready = '1';
})();
</script></body></html>
