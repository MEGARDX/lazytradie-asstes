<!doctype html>
<html><head><meta charset="utf-8">
<!-- "Can you do it before Christmas?" (Sat 14 Nov), 1080×1350. Curly-haired campaign girl tangled in fairy lights on a marigold set.
     Pre-Christmas rush hook (Adelaide Christmas Pageant weekend). Navy type + white chips for contrast on amber. -->
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700;800&display=block" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
:root{--navy:#0D1B2A}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter Tight',sans-serif;-webkit-font-smoothing:antialiased;background:#000}
#p{position:relative;width:1080px;height:1350px;overflow:hidden;color:var(--navy);background:#F2A73A}
.abs{position:absolute}
.photo{position:absolute;inset:0;background:url(img/photo.jpg) center top/1088px auto}
.big{letter-spacing:-.05em;line-height:.95}
.ch{position:absolute;left:46px;display:flex;align-items:center;gap:14px;height:74px;padding:0 26px 0 12px;border-radius:37px;background:#fff;color:var(--navy);
  font-size:26px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;box-shadow:0 14px 30px rgba(120,60,0,.25)}
.ch .i{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:26px;color:#fff}
.cta{position:absolute;display:flex;align-items:center;gap:14px;color:#FFC24D;font-weight:800;white-space:nowrap;letter-spacing:-.02em;
  background:linear-gradient(180deg,#1B3150,#0D1B2A);box-shadow:0 18px 40px rgba(80,40,0,.35),inset 0 2px 1px rgba(255,255,255,.18)}
</style></head><body>
<div id="p">
  <div class="photo"></div>
  <div class="abs big" style="left:46px;top:40px">
    <div style="font-size:90px;font-weight:300">Can you do it</div>
    <div style="font-size:98px;font-weight:800;margin-top:6px">before <span style="color:#fff;text-shadow:0 3px 18px rgba(120,60,0,.35)">Christmas?</span></div></div>

  <div class="ch" style="top:716px"><span class="i" style="background:#0A6FB0"><i class="ph-fill ph-phone-call"></i></span>Every call answered</div>
  <div class="ch" style="top:804px"><span class="i" style="background:#22A85C"><i class="ph-fill ph-calendar-check"></i></span>Jobs booked in</div>
  <div class="ch" style="top:892px"><span class="i" style="background:#E8590C"><i class="ph-fill ph-hand-tap"></i></span>Big jobs wait for you</div>

  <div class="abs big" style="left:48px;top:1010px;width:330px;font-size:38px;font-weight:800;letter-spacing:-.035em;line-height:1.05">Every customer.<br>Every call.<br><span style="color:#fff;text-shadow:0 2px 12px rgba(120,60,0,.35)">Starting now.</span></div>

  <div class="cta" style="left:46px;top:1196px;height:90px;padding:0 34px;border-radius:45px;font-size:31px">Comment “DEMO”<i class="ph-fill ph-arrow-right"></i></div>
  <div class="abs" style="right:44px;top:1184px;text-align:right;line-height:1;background:#fff;color:#0A6FB0;padding:16px 26px 18px;border-radius:28px;box-shadow:0 18px 40px rgba(120,60,0,.3)">
    <div style="font-size:20px;font-weight:700;opacity:.75">Starts at</div>
    <div style="font-size:58px;font-weight:800;letter-spacing:-.05em">A$<span style="color:#F29A00">49</span><span style="font-size:24px;font-weight:600;letter-spacing:-.02em">/month</span></div></div>
</div>
<script>
(async () => {
  await document.fonts.ready;
  await new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = 'img/photo.jpg'; });
  await new Promise(r => setTimeout(r, 300));
  document.body.dataset.ready = '1';
})();
</script></body></html>
