<!doctype html>
<html><head><meta charset="utf-8">
<!-- Black Friday greeting (Fri 27 Nov). Landscape 1620×1080 (3:2).
     All three campaign faces (blonde, curly, Asian) on a sandstone Melbourne boulevard at golden hour.
     Owner: genuine greeting, NO marketing on big days (no offer, no CTA, no link). Light theme, no jet black.
     Liquid glass on the pill and chips (owner's liquid-glass-web skill). -->
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@500&display=block" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter Tight',sans-serif;-webkit-font-smoothing:antialiased;background:#F4EEE3}
#p{position:relative;width:1620px;height:1080px;overflow:hidden;background:#F4EEE3;color:#0D1B2A}
.abs{position:absolute}
.mono{font-family:'DM Mono',monospace;letter-spacing:.22em;text-transform:uppercase}
.g{position:absolute;isolation:isolate;overflow:hidden;display:flex;align-items:center;gap:12px;white-space:nowrap;color:#0D1B2A;font-weight:600;
  border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.58),rgba(255,255,255,.22));
  box-shadow:0 18px 40px rgba(60,40,15,.16),inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 0 0 1.2px rgba(255,255,255,.65)}
.g i{font-size:27px;color:#0D1B2A}
.chip{height:62px;padding:0 24px 0 18px;font-size:23px}
</style></head><body>
<div id="p">
  <img class="abs" src="img/photo.png" style="left:0;top:0;width:1620px;height:1080px;object-fit:cover;object-position:50% 50%">
  <!-- warm ivory wash over the sandstone wall so the navy copy reads -->
  <div class="abs" style="left:0;top:0;bottom:0;width:780px;background:linear-gradient(90deg,rgba(246,240,229,.94) 0,rgba(246,240,229,.84) 48%,rgba(246,240,229,.35) 76%,rgba(246,240,229,0) 100%)"></div>
  <!-- soft amber aura so the glass has something warm to bend -->
  <div class="abs" style="left:-80px;top:620px;width:560px;height:340px;border-radius:50%;background:radial-gradient(closest-side,rgba(245,166,35,.42),rgba(245,166,35,0));filter:blur(16px)"></div>

  <img class="abs" src="img/wm_navy.png" style="left:84px;top:78px;height:36px">

  <div class="g mono" style="left:84px;top:200px;height:52px;padding:0 20px 0 16px;font-size:17px;border-radius:26px" data-lg><i class="ph ph-shopping-bag" style="font-size:22px"></i>Fri 27 Nov</div>

  <div class="abs" style="left:78px;top:282px;line-height:.98">
    <div style="font-size:98px;font-weight:700;letter-spacing:-.045em">Happy</div>
    <div style="font-family:'Instrument Serif',serif;font-style:italic;font-size:120px;letter-spacing:-.012em;color:#0D1B2A">Black Friday.</div>
  </div>
  <div class="abs" style="left:84px;top:528px;font-size:30px;font-weight:500;line-height:1.35;color:rgba(13,27,42,.8)">Enjoy the day. You've earned it.</div>

  <div class="g chip" style="left:84px;top:690px" data-lg><i class="ph ph-gift"></i>Treat yourself</div>
  <div class="g chip" style="left:84px;top:690px" data-lg><i class="ph ph-sun"></i>Take the day</div>

  <div class="abs" style="left:86px;top:966px;font-size:21px;font-weight:500;color:rgba(13,27,42,.7)">From all of us at <b style="font-weight:700;color:#0D1B2A">LazyTradie</b></div>
</div>
<script src="liquid-glass.js"></script>
<script>
(async () => {
  await document.fonts.load("700 112px 'Inter Tight'"); await document.fonts.load("italic 142px 'Instrument Serif'"); await document.fonts.load("17px 'DM Mono'"); await document.fonts.load('27px Phosphor');
  await document.fonts.ready; await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => i.onload = i.onerror = r)));
  // lay the three chips out in a row
  let y = 620; document.querySelectorAll('.chip').forEach(c => { c.style.left = '84px'; c.style.top = y + 'px'; y += c.offsetHeight + 14; });
  document.querySelectorAll('[data-lg]').forEach(g => liquidGlass(g, { scale: -60, chroma: 4, blur: 6 }));
  await new Promise(r => setTimeout(r, 400));
  document.body.dataset.ready = '1';
})();
</script>
</body></html>
